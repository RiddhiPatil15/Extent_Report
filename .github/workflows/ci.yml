name: Java BDD CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Optional (only if using Selenium)
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1

    - name: Build and Run Tests
      run: mvn clean test
      continue-on-error: true   # ⭐ KEY LINE

    - name: List target folder
      if: always()
      run: ls -R target || echo "target not found"

    - name: Upload Extent Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: extent-report
        path: target/extentreports/

    - name: Upload Cucumber Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-report
        path: target/cucumber-reports/
